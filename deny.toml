[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []
unused-ignored-advisory = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
