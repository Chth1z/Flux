name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci
      - name: Check Magisk shell bridge syntax
        run: >-
          bash -n customize.sh flux_service.sh scripts/dispatcher
          scripts/fluxctl scripts/lib scripts/flux-event scripts/rules
          tests/shell/config_installer_contract.sh
          tests/shell/rules_generation.sh tests/shell/run-dispatcher-tests.sh
          tests/shell/run-fluxctl-tests.sh tests/shell/run-installer-tests.sh
      - name: Test installer and configuration contract
        run: sh tests/shell/config_installer_contract.sh
      - name: Test legacy rule generation semantics
        run: sh tests/shell/rules_generation.sh
      - name: Ensure bubblewrap is available
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
      - name: Test Rust-owned dispatcher bridge
        run: >-
          sudo env "PATH=${PATH}" FLUX_DISPATCHER_TESTS_REQUIRED=1
          sh tests/shell/run-dispatcher-tests.sh
      - name: Test installer rollback
        run: >-
          sudo env "PATH=${PATH}" FLUX_INSTALLER_TESTS_REQUIRED=1
          sh tests/shell/run-installer-tests.sh
      - name: Test fluxctl status delegation
        run: >-
          sudo env "PATH=${PATH}" FLUXCTL_STATUS_TESTS_REQUIRED=1
          sh tests/shell/run-fluxctl-tests.sh
      - name: Check legacy addrsyncd compatibility
        run: |
          cargo test --manifest-path addrsyncd/Cargo.toml
          cargo clippy --manifest-path addrsyncd/Cargo.toml --all-targets -- -D warnings
          cargo check --manifest-path addrsyncd/Cargo.toml --target aarch64-linux-android --all-targets
