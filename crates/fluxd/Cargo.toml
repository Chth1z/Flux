[package]
name = "fluxd"
description = "Flux transparent networking daemon and control client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
native-composition-test = ["flux-platform/native-composition-test"]

[dependencies]
base64.workspace = true
flux-core = { path = "../flux-core" }
flux-platform = { path = "../flux-platform" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true

[dev-dependencies]
flux-testkit = { path = "../flux-testkit" }
tempfile = "3"

[[bin]]
name = "flux-native-composition-engine"
path = "src/bin/native_composition_engine.rs"
required-features = ["native-composition-test"]
test = false
bench = false

[lints]
workspace = true
