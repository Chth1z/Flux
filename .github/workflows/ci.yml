name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
          local-cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Audit Rust dependency advisories, licenses, and sources
        env:
          FLUX_CARGO_DENY_VERSION: "0.20.2"
          FLUX_CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -eu
          cargo_deny_archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          cargo_deny_root="${RUNNER_TEMP}/cargo-deny"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            --output "${cargo_deny_archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${FLUX_CARGO_DENY_VERSION}/cargo-deny-${FLUX_CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "${FLUX_CARGO_DENY_SHA256}" "${cargo_deny_archive}" \
            | sha256sum --check --strict
          mkdir --parents "${cargo_deny_root}"
          tar --extract --gzip --file "${cargo_deny_archive}" --directory "${cargo_deny_root}"
          "${cargo_deny_root}/cargo-deny-${FLUX_CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" \
            --manifest-path Cargo.toml --config deny.toml --all-features --locked \
            check advisories licenses sources
      - run: cargo xtask ci
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Run bounded deterministic parser fuzz smoke
        run: cargo xtask test-parser-fuzz-smoke
      - name: Test required disposable namespace topology
        run: cargo xtask test-functional-canary-linux
        env:
          FLUX_LINUX_CANARY_REQUIRED: "1"
      - name: Ensure native composition tools are available
        run: |
          if ! command -v ip >/dev/null 2>&1 || ! command -v iptables >/dev/null 2>&1 || ! command -v ip6tables >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends iproute2 iptables
          fi
      - name: Test required native composition
        run: cargo xtask test-native-composition-linux
        env:
          FLUX_NATIVE_COMPOSITION_REQUIRED: "1"
      - name: Check module platform glue syntax
        run: >-
          bash -n META-INF/com/google/android/update-binary customize.sh
          flux_service.sh uninstall.sh tests/shell/run-module-glue-tests.sh
      - name: Ensure bubblewrap is available
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
      - name: Test native module platform glue
        run: >-
          sudo env "PATH=${PATH}" FLUX_MODULE_GLUE_TESTS_REQUIRED=1
          sh tests/shell/run-module-glue-tests.sh
