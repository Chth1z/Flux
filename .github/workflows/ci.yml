name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
          local-cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Audit Rust dependency advisories, licenses, and sources
        env:
          FLUX_CARGO_DENY_VERSION: "0.20.2"
          FLUX_CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -eu
          cargo_deny_archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          cargo_deny_root="${RUNNER_TEMP}/cargo-deny"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            --output "${cargo_deny_archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${FLUX_CARGO_DENY_VERSION}/cargo-deny-${FLUX_CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "${FLUX_CARGO_DENY_SHA256}" "${cargo_deny_archive}" \
            | sha256sum --check --strict
          mkdir --parents "${cargo_deny_root}"
          tar --extract --gzip --file "${cargo_deny_archive}" --directory "${cargo_deny_root}"
          "${cargo_deny_root}/cargo-deny-${FLUX_CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" \
            --manifest-path Cargo.toml --config deny.toml --all-features --locked \
            check advisories licenses sources
      - run: cargo xtask ci
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Run bounded deterministic parser fuzz smoke
        run: cargo xtask test-parser-fuzz-smoke
      - name: Test required disposable namespace topology
        run: cargo xtask test-functional-canary-linux
        env:
          FLUX_LINUX_CANARY_REQUIRED: "1"
      - name: Check Magisk shell bridge syntax
        run: >-
          bash -n customize.sh flux_service.sh scripts/dispatcher
          scripts/lib scripts/flux-event scripts/rules
          tests/shell/config_installer_contract.sh
          tests/shell/rules_generation.sh tests/shell/run-dispatcher-tests.sh
          tests/shell/run-installer-tests.sh tests/shell/run-rust-only-glue-tests.sh
          packaging/rust-only/customize.sh packaging/rust-only/flux_service.sh
      - name: Test installer and configuration contract
        run: sh tests/shell/config_installer_contract.sh
      - name: Test legacy rule generation semantics
        run: sh tests/shell/rules_generation.sh
      - name: Ensure bubblewrap is available
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
      - name: Test Rust-owned dispatcher bridge
        run: >-
          sudo env "PATH=${PATH}" FLUX_DISPATCHER_TESTS_REQUIRED=1
          sh tests/shell/run-dispatcher-tests.sh
      - name: Test installer rollback
        run: >-
          sudo env "PATH=${PATH}" FLUX_INSTALLER_TESTS_REQUIRED=1
          sh tests/shell/run-installer-tests.sh
      - name: Test Rust-only package glue
        run: >-
          sudo env "PATH=${PATH}" FLUX_RUST_ONLY_GLUE_TESTS_REQUIRED=1
          sh tests/shell/run-rust-only-glue-tests.sh
      - name: Check legacy addrsyncd compatibility
        run: |
          cargo test --manifest-path addrsyncd/Cargo.toml
          cargo clippy --manifest-path addrsyncd/Cargo.toml --all-targets -- -D warnings
          cargo check --manifest-path addrsyncd/Cargo.toml --target aarch64-linux-android --all-targets

  xtables-oracle:
    name: Pinned xtables shell oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Pull exact BusyBox linux/amd64 oracle image
        run: >-
          docker pull --platform=linux/amd64
          docker.io/library/busybox@sha256:dfb66b2b3e6981fefa54fd2cd4faf662c35b4a4baeff48295a9409ddf3224c48
      - name: Verify pinned xtables restore fixtures
        run: cargo xtask xtables-oracle --check
