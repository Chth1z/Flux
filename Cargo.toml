[workspace]
members = [
  "crates/flux-core",
  "crates/flux-platform",
  "crates/flux-testkit",
  "crates/fluxd",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
repository = "https://github.com/Chth1z/Flux"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(flux_android_qualification)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
base64 = "=0.22.1"
flate2 = "1.1.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls", "gzip", "brotli"] }
url = "=2.5.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
